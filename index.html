<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>HH.BAKU - Paltar mağazası</title>
<meta name="description" content="HH.BAKU: Bakıdan paltar mağazası. Yeni kolleksiya, sifariş Instagram və WhatsApp-da.">
<link rel="icon" type="image/png" href="/logo.png?v=1">
<link rel="shortcut icon" href="/logo.png?v=1">
<link rel="apple-touch-icon" href="/logo.png?v=1">
<link rel="canonical" href="https://hhbaku.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HH.BAKU">
<meta property="og:title" content="HH.BAKU - Paltar mağazası">
<meta property="og:description" content="Yeni kolleksiya. Ölçünü seç, bizə yaz.">
<meta property="og:url" content="https://hhbaku.vercel.app/">
<meta property="og:image" content="https://hhbaku.vercel.app/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://hhbaku.vercel.app/logo.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"HH.BAKU","alternateName":["hh.baku","HHBAKU"],"url":"https://hhbaku.vercel.app/","logo":"https://hhbaku.vercel.app/logo.png","image":"https://hhbaku.vercel.app/logo.png","sameAs":["https://instagram.com/hh.baku"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"><a class="logo" href="#" aria-label="HH.BAKU"><img class="logo-img" src="logo.png?v=1" alt="HH.BAKU logosu" height="36" onerror="this.remove()"><span id="logo"></span></a><a class="btn sm" id="igTop" target="_blank" rel="noopener">Instagram</a></nav>
<header class="hero"><div class="wrap">
  <h1 id="title"></h1>
  <p id="text"></p>
  <div class="cta"><a class="btn" href="#shop">Məhsullara bax</a><a class="btn ghost" id="igHero" target="_blank" rel="noopener">Bizə yaz</a></div>
</div></header>
<main class="wrap" id="shop">
  <div class="bar"><h2>Məhsullar <small id="count" style="color:var(--mute);font:600 .9rem Manrope"></small></h2><input class="search" id="q" type="search" placeholder="Məhsul axtar" aria-label="Məhsul axtar"></div>
  <div class="chips" id="chips" hidden></div>
  <div class="grid" id="grid"><div class="empty">Yüklənir…</div></div>
  <div class="steps" id="steps"></div>
</main>
<footer><div class="wrap"><img class="logo-img" src="logo.png?v=1" alt="HH.BAKU logosu" height="44" loading="lazy" onerror="this.remove()"><span>© <span id="yr"></span> <span id="nm"></span></span><a id="igFoot" target="_blank" rel="noopener"></a></div></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, INSTAGRAM, WHATSAPP, CURRENCY, BRAND } from "./site-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = (u, w) => u.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`);
const ig = `https://instagram.com/${INSTAGRAM}`, dm = `https://ig.me/m/${INSTAGRAM}`;
const orderLink = p => WHATSAPP ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Salam, sifariş etmək istəyirəm: " + p.name)}` : dm;

const [a, b] = BRAND.name.split(".");
$("logo").innerHTML = b ? `${esc(a)}<b>.</b>${esc(b)}` : esc(a);
$("title").innerHTML = b ? `${esc(a)}<span>.${esc(b)}</span>` : esc(a);
$("text").textContent = BRAND.tagline + " " + BRAND.text;
$("igTop").href = ig; $("igHero").href = WHATSAPP ? `https://wa.me/${WHATSAPP}` : dm;
$("igFoot").href = ig; $("igFoot").textContent = "@" + INSTAGRAM;
$("nm").textContent = BRAND.name; $("yr").textContent = new Date().getFullYear();
document.title = `${BRAND.name} - Paltar mağazası`;
$("steps").innerHTML = BRAND.steps.map((s, i) => `<div class="step"><strong>${i + 1}</strong>${esc(s)}</div>`).join("");

let products = [], active = "Hamısı", term = "";
const tag = n => n <= 0 ? '<span class="tag">Bitib</span>' : n <= 3 ? `<span class="tag low">Son ${n} ədəd</span>` : "";
const sizes = s => { const x = String(s || "").split(/[,\s/]+/).filter(Boolean); return x.length ? `<div class="sizes">${x.map(v => `<span>${esc(v)}</span>`).join("")}</div>` : ""; };

function render(){
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  if (active !== "Hamısı" && !cats.includes(active)) active = "Hamısı";
  $("chips").hidden = !cats.length;
  $("chips").innerHTML = ["Hamısı", ...cats].map(c => `<button class="chip${c === active ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const t = term.toLowerCase();
  const list = products.filter(p => (active === "Hamısı" || p.category === active) && p.name.toLowerCase().includes(t));
  $("count").textContent = `(${list.length})`;
  $("grid").innerHTML = list.length ? list.map(p => `
    <article class="card${p.stock <= 0 ? " sold" : ""}">
      <div class="ph"><img src="${img(p.image, 600)}" alt="${esc(p.name)}" loading="lazy" decoding="async">${tag(p.stock)}</div>
      <div class="info">
        ${p.category ? `<div class="cat">${esc(p.category)}</div>` : ""}
        <h3>${esc(p.name)}</h3>${sizes(p.sizes)}
        <div class="price">${Number(p.price).toFixed(2)} ${CURRENCY}</div>
        ${p.stock > 0 ? `<a class="btn block" href="${orderLink(p)}" target="_blank" rel="noopener">Sifariş et</a>` : '<span class="btn off block">Bitib</span>'}
      </div></article>`).join("") : `<div class="empty">${products.length ? "Bu axtarışa uyğun məhsul tapılmadı." : "Tezliklə yeni məhsullar əlavə olunacaq."}</div>`;
}
// Canlı: admin dəyişiklik edən kimi sayt özü yenilənir
onSnapshot(doc(db, "shop", "catalog"), s => {
  products = (s.exists() ? s.data().items || [] : []).slice().sort((x, y) => y.createdAt - x.createdAt); render();
}, () => { $("grid").innerHTML = '<div class="empty">Məhsullar yüklənmədi. Bir az sonra yenidən yoxlayın.</div>'; });

$("q").addEventListener("input", e => { term = e.target.value.trim(); render(); });
$("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c){ active = c.dataset.c; render(); } });
</script>
</body>
</html>
