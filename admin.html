<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="icon" type="image/png" href="/logo.png?v=1">
<link rel="shortcut icon" href="/logo.png?v=1">
<link rel="apple-touch-icon" href="/logo.png?v=1">

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login" id="loginBox">
  <img class="logo-img" src="logo.png?v=1" alt="" height="48" style="margin-bottom:14px" onerror="this.remove()">
  <h1 id="loginTitle">Admin</h1>
  <label for="em">E-poçt</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Şifrə</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn block" id="loginBtn" style="margin-top:18px">Daxil ol</button>
  <p id="loginErr" style="color:#ff7a82;margin-top:12px;font-size:.9rem"></p>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <a class="logo" href="index.html"><img class="logo-img" src="logo.png?v=1" alt="" height="36" onerror="this.remove()"><span id="brandName"></span></a>
    <div style="display:flex;gap:10px;align-items:center">
      <b id="count"></b>
      <a class="btn ghost sm" href="index.html" target="_blank">Sayta bax</a>
      <button class="btn ghost sm" id="logout">Çıxış</button>
    </div>
  </header>
  <div class="quota" id="quota"></div>
  <div class="layout">
    <section class="panel">
      <h2 style="margin-bottom:6px;font-size:1.2rem">Yeni məhsul</h2>
      <label>Şəkil</label>
      <label class="drop" for="file" id="drop"><span>Şəkil seçmək üçün toxunun</span></label>
      <input id="file" type="file" accept="image/*" hidden>
      <label for="name">Ad</label><input id="name" maxlength="60">
      <label for="cat">Kateqoriya (istəyə bağlı)</label>
      <input id="cat" list="cats" maxlength="30"><datalist id="cats"></datalist>
      <div class="two">
        <div><label for="price">Qiymət</label><input id="price" type="number" min="0" step="0.01"></div>
        <div><label for="stock">Stok (ədəd)</label><input id="stock" type="number" min="0" step="1"></div>
      </div>
      <label for="sizes">Ölçülər (istəyə bağlı)</label><input id="sizes" maxlength="40" placeholder="S, M, L, XL">
      <button class="btn block" id="add" style="margin-top:18px">Məhsulu əlavə et</button>
    </section>
    <section class="panel">
      <h2 style="margin-bottom:6px;font-size:1.2rem">Mövcud məhsullar</h2>
      <div id="list"><p style="color:var(--mute)">Yüklənir…</p></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, ADMIN_EMAIL, MAX_PRODUCTS, CLOUD_NAME, UPLOAD_PRESET, BRAND, CATEGORIES } from "./site-config.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const ref = doc(db, "shop", "catalog");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thumb = (u, w) => u.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`);
const MSG_COUNT = `${MAX_PRODUCTS} məhsul limiti dolub. Bir məhsulu silin və ya site-config.js-də limiti artırın.`;
const MSG_UPLOAD = "Şəkil yüklənmədi. Cloudinary kotası dolmuş ola bilər və ya Cloud name / Upload preset səhvdir.";
let imageBlob = null, itemCount = 0, unsub = null;
$("loginTitle").textContent = `${BRAND.name} admin`; $("brandName").textContent = BRAND.name;
document.title = `${BRAND.name} - Admin`;
$("cats").innerHTML = CATEGORIES.map(c => `<option value="${esc(c)}">`).join("");

function toast(msg, err){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : ""); setTimeout(() => t.className = "toast", 3200); }
function showQuota(msg){ const q = $("quota"); q.textContent = msg; q.classList.add("show"); window.scrollTo({ top: 0, behavior: "smooth" }); toast(msg, true); }

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("loginErr").textContent = "E-poçt və ya şifrə yanlışdır."; }
};
$("logout").onclick = () => signOut(auth);
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL){ $("loginBox").hidden = true; $("app").hidden = false; if (!unsub) unsub = onSnapshot(ref, s => renderList(s.exists() ? s.data().items || [] : [])); }
  else {
    if (unsub){ unsub(); unsub = null; }
    if (user){ signOut(auth); $("loginErr").textContent = "Bu hesabın admin icazəsi yoxdur."; }
    $("loginBox").hidden = false; $("app").hidden = true;
  }
});

const mutate = fn => runTransaction(db, async tx => {
  const s = await tx.get(ref);
  tx.set(ref, { items: fn(s.exists() ? s.data().items || [] : []), updatedAt: Date.now() });
});

$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1200 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    c.toBlob(b => { imageBlob = b; $("drop").innerHTML = `<img src="${URL.createObjectURL(b)}" alt="Önizləmə">`; }, "image/jpeg", .85);
  };
  im.src = URL.createObjectURL(f);
};
async function uploadImage(blob){
  const fd = new FormData(); fd.append("file", blob); fd.append("upload_preset", UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
  if (!r.ok) throw new Error("UPLOAD");
  return (await r.json()).secure_url;
}

function renderList(all){
  const items = all.slice().sort((a, b) => b.createdAt - a.createdAt);
  itemCount = items.length;
  $("count").textContent = MAX_PRODUCTS ? `${itemCount}/${MAX_PRODUCTS}` : `${itemCount} məhsul`;
  if (MAX_PRODUCTS && itemCount >= MAX_PRODUCTS) showQuota(MSG_COUNT); else $("quota").classList.remove("show");
  $("list").innerHTML = items.length ? items.map(p => `
    <div class="item" data-id="${esc(p.id)}">
      <img src="${thumb(p.image, 150)}" alt="">
      <div><strong>${esc(p.name)}</strong><div style="color:var(--mute);font-size:.85rem">${esc([p.category, p.sizes].filter(Boolean).join(" · "))}</div>
        <div class="edit">
          <input type="number" min="0" step="0.01" value="${p.price}" data-f="price" aria-label="Qiymət">
          <input type="number" min="0" step="1" value="${p.stock}" data-f="stock" aria-label="Stok">
          <button class="btn sm ghost" data-act="save">Yadda saxla</button>
        </div></div>
      <button class="btn sm danger" data-act="del">Sil</button>
    </div>`).join("") : '<p style="color:var(--mute)">Hələlik məhsul yoxdur. İlk məhsulu formadan əlavə edin.</p>';
}
$("list").onclick = async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const row = b.closest(".item"), id = row.dataset.id;
  try {
    if (b.dataset.act === "del"){
      if (!confirm("Bu məhsul silinsin?")) return;
      await mutate(a => a.filter(x => x.id !== id)); toast("Silindi");
    } else {
      const price = parseFloat(row.querySelector('[data-f="price"]').value), stock = parseInt(row.querySelector('[data-f="stock"]').value, 10);
      if (isNaN(price) || isNaN(stock)) return toast("Qiymət və stoku düzgün yazın", true);
      await mutate(a => a.map(x => x.id === id ? { ...x, price, stock } : x)); toast("Yadda saxlanıldı");
    }
  } catch (err) { console.error(err); toast("Xəta baş verdi", true); }
};

$("add").onclick = async () => {
  const name = $("name").value.trim(), price = parseFloat($("price").value), stock = parseInt($("stock").value, 10);
  if (!imageBlob) return toast("Şəkil seçin", true);
  if (!name || isNaN(price) || isNaN(stock)) return toast("Ad, qiymət və stoku doldurun", true);
  if (MAX_PRODUCTS && itemCount >= MAX_PRODUCTS) return showQuota(MSG_COUNT);
  $("add").disabled = true;
  try {
    const image = await uploadImage(imageBlob);
    await mutate(a => [...a, { id: crypto.randomUUID(), name, category: $("cat").value.trim(), sizes: $("sizes").value.trim(), price, stock, image, createdAt: Date.now() }]);
    imageBlob = null; ["name","cat","price","stock","sizes","file"].forEach(i => $(i).value = "");
    $("drop").innerHTML = "<span>Şəkil seçmək üçün toxunun</span>"; toast("Məhsul əlavə olundu");
  } catch (e) {
    console.error(e);
    if (e.message === "UPLOAD") showQuota(MSG_UPLOAD);
    else if (e.code === "resource-exhausted") showQuota("Firebase gündəlik limiti dolub. Bir qədər sonra yenidən sınayın.");
    else toast("Xəta: əlavə edilmədi", true);
  } finally { $("add").disabled = false; }
};
</script>
</body>
</html>
